{% extends 'base.html' %}

{% block title %}Password Reset Complete - Trending News{% endblock %}

{% block content %}
<div style="min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; background-color: #ffffff;">
    <div style="width: 100%; max-width: 440px; padding: 40px 32px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); text-align: left;">
        
        <div style="display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px;">
            <span style="background: #000; color: #fff; font-weight: 900; font-size: 0.95rem; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;">T</span>
            <span style="background: #000; color: #fff; font-weight: 900; font-size: 0.95rem; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;">N</span>
            <span style="font-weight: 800; font-size: 0.9rem; letter-spacing: 1px; margin-left: 6px; color: #000;">SUCCESS</span>
        </div>

        <h1 style="font-size: 1.85rem; font-weight: 900; color: #000000; line-height: 1.25; margin-bottom: 12px; font-family: Arial, Helvetica, sans-serif;">
            Password updated
        </h1>
        
        <p style="color: #475569; font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px;">
            Your password has been changed successfully. You can now use your new credentials to log in.
        </p>

        <a href="{% url 'login' %}" 
           style="display: inline-block; width: 100%; box-sizing: border-box; text-align: center; height: 46px; line-height: 46px; background: #000000; color: #ffffff; font-weight: 900; font-size: 0.95rem; text-decoration: none; border-radius: 2px;">
            Sign in now
        </a>

    </div>
</div>
{% endblock %}
