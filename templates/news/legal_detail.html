{% extends 'base.html' %}

{% block title %}{{ page.title }} - {{ site_setting.site_name|default:"Trending News" }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 900px; padding-top: 40px; padding-bottom: 60px;">
    
    <div style="border-bottom: 2px solid #e2e8f0; padding-bottom: 18px; margin-bottom: 28px;">
        <h1 style="font-family: 'Cinzel', serif; font-size: 2.3rem; color: #0f172a; margin-bottom: 8px;">
            {{ page.title }}
        </h1>
        <div style="color: #64748b; font-size: 0.88rem;">
            Last updated &bull; {{ page.updated_at|date:"F d, Y" }}
        </div>
    </div>

    <div style="font-size: 1.1rem; line-height: 2; color: #334155; white-space: pre-line; background: #ffffff; padding: 35px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
        {{ page.content }}
    </div>

    <div style="margin-top: 35px;">
        <a href="{% url 'home' %}" class="read-more-btn" style="font-size: 0.95rem;">&larr; Back to Home</a>
    </div>

</div>
{% endblock %}
